name: AI DevOps Chatbot CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint ./helm/ai-chatbot

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=surajtiwari688_ai-devops-chatbot
            -Dsonar.organization=surajtiwari688
            

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

          
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/ai-chatbot:v3 .
      
      - name: Run Trivy vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.actor }}/ai-chatbot:v3
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.actor }}/ai-chatbot:v3
      
      