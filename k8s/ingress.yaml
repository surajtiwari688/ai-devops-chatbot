apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-chatbot-ingress
spec:
  rules:
  - host: ai-chatbot.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-chatbot-service
            port:
              number: 8000